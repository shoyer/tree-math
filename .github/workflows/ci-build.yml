name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pytest-job:
    name: "python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install tree-math
      run: |
        pip install -e .[tests]
    - name: Run unit tests
      run: |
        pytest -v tree_math

  # Auto-publish to PyPI when the version is increased (requires the
  # PYPI_API_TOKEN repository secret).
  publish-job:
    if: |
      github.repository == 'shoyer/tree-math'
      && github.ref == 'refs/heads/main'
    needs: pytest-job
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
    - uses: etils-actions/pypi-auto-publish@v1
      with:
        pypi-token: ${{ secrets.PYPI_API_TOKEN }}
        gh-token: ${{ secrets.GITHUB_TOKEN }}
